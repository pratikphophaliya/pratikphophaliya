name: Redraw profile

on:
  schedule:
    - cron: "17 0 * * *" # every night, 00:17 UTC
  workflow_dispatch:
    inputs:
      look:
        description: "Force a look (blank = random)"
        required: false
        type: choice
        options: ["", "blue", "white"]

permissions:
  contents: write

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Draw today's README
        run: node scripts/generate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOK: ${{ inputs.look }}
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "redraw: $(date -u +%F)" && git push)
